<VirtualHost *:80>
    ServerName astronoches.local
    DocumentRoot /var/www/astronoches/public

    <Directory /var/www/astronoches/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/astronoches_error.log
    CustomLog ${APACHE_LOG_DIR}/astronoches_access.log combined
</VirtualHost>
